server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: composite-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}"

  cloud:
    config:
      enabled: ${CONFIG_ENABLED:true}
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
      fail-fast: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOSTNAME:composite-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
